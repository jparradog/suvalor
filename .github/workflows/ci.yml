name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run pytest -v

  lint-meta:
    name: Validar metadata + datos personales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que no haya datos personales hardcodeados
        run: |
          set -e
          # Patrones que NUNCA deben aparecer en el repo. Ajustar si cambia
          # algo legitimo (ej. un nuevo URL del portal).
          PATTERNS=(
            '21189704'
            '766257'
            'D:/Users/'
            'D:\\Users\\'
            'Downloads/DocsValores'
          )
          for p in "${PATTERNS[@]}"; do
            if git grep -nF "$p" -- ':!CHANGELOG.md' ':!.github/workflows/*'; then
              echo "::error::Patron prohibido encontrado: $p"
              exit 1
            fi
          done
          echo "OK — no se encontraron datos personales."

      - name: Verificar coherencia de version
        run: |
          # __version__ ahora se lee desde metadata, asi que solo verificamos
          # que pyproject.toml tenga una version SemVer valida.
          grep -E '^version = "[0-9]+\.[0-9]+\.[0-9]+"' pyproject.toml || \
            (echo "::error::version invalida en pyproject.toml" && exit 1)
